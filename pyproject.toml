[build-system]
requires = ["briefcase"]
build-backend = "briefcase.appmeta"

[project]
name = "newganmanager"
version = "1.5"
description = "Football Manager NewGAN Replacement Tool"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "huangzhanhao"},
]
dependencies = [
    "toga>=0.5.7",
    "requests>=2.34.2",
    # dhooks 仅发布 sdist（PyPI 无 wheel）。briefcase 打包时会连本表一起安装，
    # 而 macOS/arm64 只接受 wheel，故此处不留；Reporter.py 当前无调用方。
]

[project.urls]
Homepage = "https://github.com/huangzhanhao/NewGAN-Manager"

[tool.briefcase]
project_name = "NewGAN-Manager"
bundle = "com.fm"

[tool.briefcase.app.newganmanager]
formal_name = "NewGAN Manager"
description = "Football Manager NewGAN Replacement Tool"
long_description = """Football Manager 随机人（NewGAN）头像批量匹配工具。

读取 FM 导出的 RTF 名单，按「国籍 + 种族」从 facepack 中挑选头像，生成 FM 能识别的 config.xml，让随机人自动拥有头像。支持多 Profile 管理、中文 RTF、三种替换模式与单球员微调。"""
icon = "src/newganmanager/resources/newganmanager"
sources = ['src/newganmanager']
requires = [
    "toga>=0.5.7",
    "requests>=2.34.2",
    # dhooks 仅发布 sdist（PyPI 无 wheel），briefcase 的打包环境装不了；
    # 唯一使用方 Reporter.py 目前未被任何代码引用，故不列入打包依赖。
    # 需要 webhook 上报时自行 pip install dhooks。
]

[tool.briefcase.app.newganmanager.macOS]
requires = [
    'toga-cocoa>=0.5.7',
    'rubicon-objc>=0.6.0',
]

[tool.briefcase.app.newganmanager.linux]
requires = [
    'toga-gtk>=0.5.7',
]
system_requires = [
    'libgirepository1.0-dev',
    'libgirepository-2.0-dev',
    'libcairo2-dev',
    'libpango1.0-dev',
    'libgdk-pixbuf-2.0-dev',
    'libgtk-3-dev',
    'libwebkit2gtk-4.1-dev',
    'gir1.2-webkit2-4.1',
]

[tool.briefcase.app.newganmanager.windows]
requires = [
    'toga-winforms>=0.5.7',
]

[tool.briefcase.app.newganmanager.iOS]
requires = [
    'toga-iOS>=0.5.7',
]

[tool.briefcase.app.newganmanager.android]
requires = [
    'toga-android>=0.5.7',
]
