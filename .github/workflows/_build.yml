name: _Build

# 单平台构建/打包模板，由 windows.yml / linux.yml / macos.yml / release.yml 复用。
# 不直接触发，仅供 workflow_call。
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      label:
        required: true
        type: string
      packaging_format:
        required: true
        type: string
      artifact_pattern:
        required: true
        type: string
      adhoc_sign:
        required: false
        type: boolean
        default: false
      upload_artifact:
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build (${{ inputs.label }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux 不装 setup-python：briefcase 的 Linux system 后端会校验
      # 「运行 briefcase 的 Python 主次版本 == /usr/bin/python3 的主次版本」，
      # 装 setup-python 会让两者错位（如 3.12.16 vs 系统 3.12.3）并直接报错退出。
      - uses: actions/setup-python@v5
        if: inputs.os != 'ubuntu-24.04'
        with:
          python-version: '3.12'

      - name: Install system dependencies (toga-gtk)
        if: inputs.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev libgirepository-2.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 python3-venv python3-dev

      - name: Prepare system python3 (Linux)
        if: inputs.os == 'ubuntu-24.04'
        run: |
          python3 --version
          python3 -m venv .ci-venv
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      # 固定 0.3.25：0.4.7 的 Windows 应用模板引用 LICENSE.rtf，但 briefcase 0.4.7
      # 的 install_license() 并未接线（install_app_resources 只调 super），
      # 打包必然报 WIX0103；0.3.x 模板不含许可对话框，无需该文件。
      - name: Install Briefcase
        run: python -m pip install "briefcase==0.3.25"

      - name: Create and build
        run: |
          python -m briefcase create
          python -m briefcase build

      - name: Package
        run: >-
          python -m briefcase package
          -p ${{ inputs.packaging_format }}
          ${{ inputs.adhoc_sign && '--adhoc-sign' || '' }}

      - name: Upload artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewGAN-Manager-${{ inputs.label }}
          path: ${{ inputs.artifact_pattern }}
          if-no-files-found: error
